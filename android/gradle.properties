# Keep enough headroom for Flutter, ADB and the two vendor SDK toolchains on
# the 16 GB Windows development machine. The previous 8 GB heap caused severe
# paging and made debug/device builds appear to hang.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The repository intentionally lives under a Chinese business directory.
android.overridePathCheck=true
# Pub packages and the project can live on different Windows volumes.
kotlin.incremental=false
# Avoid hanging indefinitely when an upstream Maven connection stops sending data.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
