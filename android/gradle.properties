org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The repository intentionally lives under a Chinese business directory.
android.overridePathCheck=true
# Pub packages and the project can live on different Windows volumes.
kotlin.incremental=false
# Avoid hanging indefinitely when an upstream Maven connection stops sending data.
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
